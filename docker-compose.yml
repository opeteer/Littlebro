version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: redis-server --port 6341
    ports:
      - "6341:6341"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8041:8041"
    environment:
      - REDIS_URL=redis://redis:6341/0
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3041:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
